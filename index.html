<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏸 Badminton Matcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0f172a; color: #f1f5f9; }
    body { font-family: 'Sarabun', sans-serif; font-size: 18px; }
    #app { width: 90vw; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 2vh 0; gap: 1.5vh; }
    .btn { transition: transform 0.1s; cursor: pointer; border: none; font-family: inherit; touch-action: manipulation; }
    .btn:active { transform: scale(0.96); }
    button, input { touch-action: manipulation; }
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .del-mode-card { background:#3f1212 !important; color:#fca5a5 !important; }
  </style>
</head>
<body>
  <div id="ptr" style="position:fixed;top:0;left:0;right:0;height:0;background:#0f172a;display:flex;align-items:flex-end;justify-content:center;padding-bottom:0;overflow:hidden;z-index:200"></div>
  <div id="app"></div>
  <script>
  'use strict';

  const STORAGE_KEY = 'bmt_v7';

  function defaultState() {
    return {
      nextId: 1,
      players: [],        // [{id, name}]
      presentIds: [],     // int[]
      screen: 'setup',    // 'setup' | 'playing' | 'newcycle' | 'final'
      // Playing
      teams: [],          // [[id,id], ...] current team pairs (solo = [id])
      courtIdx: 0,        // index into teams[] of court holder
      challengerIdx: 1,   // index into teams[] of current challenger
      waitQueue: [],      // team indices waiting (not court, not challenger)
      cyclePlayedPairs:[], // "i,j" strings of team pairs played this cycle
      rounds: [],         // {id, courtTeam, challengerTeam, winner:'court'|'challenger'}
      scores: {},         // {id: int}
      usedPartners: [],   // partner pairs used across all cycles
      cycleCount: 1,
      restingIds: [],
      lastSoloId: null,   // id of player who was solo last cycle
      schedule: [],       // precomputed round-robin schedule (array of team arrays)
      scheduleIdx: 0,     // current position in schedule
      playerConsecutive: {}, // {playerId: consecutiveMatchCount} — persists across cycles
      mode: 'full',          // 'full' | 'limited' | 'tournament'
      matchesPerCycle: 3,   // used only in 'limited' mode — matches per team per cycle
      teamMatchCounts: {},  // {teamIdx: matchCount} reset each cycle
      dualCourt: false,          // play 2 courts simultaneously
      courtIdxB: null,           // court B team index (null = court B idle/unused)
      challengerIdxB: null,      // court B challenger index (null = idle, waiting for other court)
      tournamentTeams: [],       // fixed team pairs for tournament mode — set once, persists whole session
      tournamentQueue: [],       // remaining [teamIdxA, teamIdxB] pairs for the current tournament round
      tournamentLastResult: {},  // {teamIdx: 'win'|'loss'|'bye'} from the round in progress — feeds next round pairing
      tournamentPlayedPairs: [], // "i,j" team-idx pairs ever played — minimizes rematches across rounds
    };
  }

  let S = (() => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) return saved;
      // Migrate player list from previous versions (discard old game state)
      for (const oldKey of ['bmt_v6', 'bmt_v5', 'bmt_v4', 'bmt_v3']) {
        const old = JSON.parse(localStorage.getItem(oldKey));
        if (old?.players?.length) {
          const d = defaultState();
          d.nextId = old.nextId || 1;
          d.players = old.players;
          return d;
        }
      }
      return defaultState();
    } catch { return defaultState(); }
  })();
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }

  let deleteMode = false;
  let showSummary = false;
  let summaryCycle = 1;
  let undoStack = [];
  let showAddPlayer = false;
  let theme = localStorage.getItem('bmt_theme') || 'light';

  // Dark → Light pastel color map (applied via replaceAll on rendered HTML)
  const DARK_TO_LIGHT = [
    ['#0f172a','#FFF9D2'],['#1e293b','#FFEBCC'],['#334155','#c8dff0'],
    ['#475569','#6b7280'],['#64748b','#9ca3af'],['#94a3b8','#374151'],
    ['#f1f5f9','#2d3748'],['#cbd5e1','#4a5568'],
    ['#2563eb','#5b8bb5'],['#1d4ed8','#5b8bb5'],
    ['#16a34a','#3d8b5a'],['#22c55e','#4caf70'],
    ['#1e3a5f','#d4eaf7'],['#93c5fd','#1a4971'],['#bfdbfe','#1a4971'],
    ['#3f1212','#fde8d8'],['#991b1b','#c47a5a'],
    ['#fca5a5','#7a3300'],['#fecaca','#7a3300'],
    ['#7c3aed','#7b6ac4'],['#451a00','#fde8d8'],
    ['#78350f','#c47a5a'],['#d97706','#b87040'],
    ['#7f1d1d','#f5c0b0'],['#1e3a2f','#d4f0e4'],
    ['#4ade80','#1d7a45'],['#86efac','#2d9b5e'],
    ['#fde68a','#7a5c00'],['#fbbf24','#b87040'],
  ];

  function applyThemeToDOM() {
    const bg = theme === 'light' ? '#FFF9D2' : '#0f172a';
    const fg = theme === 'light' ? '#2d3748' : '#f1f5f9';
    document.body.style.background = bg;
    document.body.style.color = fg;
    document.documentElement.style.background = bg;
    let el = document.getElementById('bmt-theme-style');
    if (!el) { el = document.createElement('style'); el.id = 'bmt-theme-style'; document.head.appendChild(el); }
    el.textContent = theme === 'light'
      ? '.del-mode-card{background:#fde0d5!important;color:#7a3300!important}'
      : '.del-mode-card{background:#3f1212!important;color:#fca5a5!important}';
  }

  // Re-render summary on orientation/resize so cell size recomputes
  let _resizeTimer = null;
  window.addEventListener('resize', () => {
    if (!showSummary) return;
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(render, 150);
  });

  // ── Helpers ────────────────────────────────────────────────────────
  function pname(id) { return S.players.find(p => p.id === id)?.name ?? '?'; }
  function pairKey(a, b) { return a < b ? `${a},${b}` : `${b},${a}`; }
  // Key for team-vs-team pair (by team index)
  function tpKey(i, j) { return i < j ? `${i},${j}` : `${j},${i}`; }

  // Compute the set of used partner pairs directly from round history (ground truth)
  function usedPartnerSet() {
    const used = new Set();
    (S.rounds || []).forEach(r => {
      [r.courtTeam, r.challengerTeam].forEach(team => {
        if (team && team.length === 2) used.add(pairKey(team[0], team[1]));
      });
    });
    return used;
  }

  // Returns true when all possible partner pairs have been used at least once
  function allPartnersUsed() {
    const n = S.presentIds.length;
    const total = n * (n - 1) / 2;
    return usedPartnerSet().size >= total;
  }

  // Find next challenger for one court slot ('A' or 'B'). S[courtField] must already be set.
  // Returns 'ok' (challenger assigned), 'done' (whole round/cycle complete — no unplayed pairs left anywhere),
  // or 'blocked' (pairs remain, but none available right now because the only candidates are active on the other court).
  function setupNextMatchForSlot(slot) {
    const courtField = slot === 'A' ? 'courtIdx' : 'courtIdxB';
    const challField = slot === 'A' ? 'challengerIdx' : 'challengerIdxB';
    const cIdx = S[courtField];
    const played = new Set(S.cyclePlayedPairs);

    if (S.mode === 'limited') {
      const threshold = S.matchesPerCycle || 3;
      const tmc = S.teamMatchCounts || {};
      const N = S.teams.length;
      if (Array.from({length: N}, (_, i) => (tmc[i] || 0)).every(c => c >= threshold)) return 'done';
      const idx = S.waitQueue.findIndex(i =>
        (tmc[i] || 0) < threshold && !played.has(tpKey(cIdx, i))
      );
      if (idx >= 0) { S[challField] = S.waitQueue.splice(idx, 1)[0]; return 'ok'; }
      const pool = [...S.waitQueue, cIdx];
      const underCap = pool.filter(i => (tmc[i] || 0) < threshold);
      for (let i = 0; i < underCap.length; i++) {
        for (let j = i + 1; j < underCap.length; j++) {
          if (!played.has(tpKey(underCap[i], underCap[j]))) {
            const newCourt = underCap[i], newChallenger = underCap[j];
            S.waitQueue = pool.filter(x => x !== newCourt && x !== newChallenger);
            S[courtField] = newCourt;
            S[challField] = newChallenger;
            return 'ok';
          }
        }
      }
      const stillPending = Array.from({length: N}, (_, i) => i).some(i => (tmc[i] || 0) < threshold);
      return stillPending ? 'blocked' : 'done';
    }

    // Full mode: play all C(N,2) team pairs
    const N = S.teams.length;
    const total = N * (N - 1) / 2;
    if (played.size >= total) return 'done';

    for (let i = 0; i < S.waitQueue.length; i++) {
      if (!played.has(tpKey(cIdx, S.waitQueue[i]))) {
        S[challField] = S.waitQueue.splice(i, 1)[0];
        return 'ok';
      }
    }

    const pool = [...S.waitQueue, cIdx];
    for (let i = 0; i < pool.length; i++) {
      for (let j = i + 1; j < pool.length; j++) {
        if (!played.has(tpKey(pool[i], pool[j]))) {
          const newCourt = pool[i], newChallenger = pool[j];
          S.waitQueue = pool.filter(x => x !== newCourt && x !== newChallenger);
          S[courtField] = newCourt;
          S[challField] = newChallenger;
          return 'ok';
        }
      }
    }
    return 'blocked'; // unplayed pairs remain but only involve teams active on the other court
  }

  // Shuffle array in place (Fisher-Yates)
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Round-robin circle method (1-factorization of K_N).
  // Guarantees every pair of players partners exactly once before any repeat.
  // Returns an array of cycles; each cycle is an array of teams (pair or solo).
  // Solo team is placed at index 0 so the solo player takes court first.
  function buildSchedule(shuffledIds) {
    const N = shuffledIds.length;

    function evenSchedule(ids) {
      const M = ids.length;
      const fixed = ids[M - 1];
      const circle = ids.slice(0, M - 1);
      const rounds = [];
      for (let r = 0; r < M - 1; r++) {
        const teams = [[fixed, circle[r % (M - 1)]]];
        for (let i = 1; i <= (M - 2) / 2; i++) {
          teams.push([circle[(r + i) % (M - 1)], circle[(r - i + M - 1) % (M - 1)]]);
        }
        rounds.push(teams);
      }
      return rounds;
    }

    if (N % 2 === 0) return evenSchedule(shuffledIds);

    // Odd N: augment with dummy -1, replace dummy team with solo
    return evenSchedule([...shuffledIds, -1]).map(teams => {
      const dummyTeam = teams.find(t => t.includes(-1));
      const soloId = dummyTeam.find(id => id !== -1);
      return [[soloId], ...teams.filter(t => !t.includes(-1))];
    });
  }

  // Fixed team formation for tournament mode — set once, persists whole session
  function buildFixedTeams(ids) {
    const shuffled = shuffle([...ids]);
    const teams = [];
    for (let i = 0; i + 1 < shuffled.length; i += 2) teams.push([shuffled[i], shuffled[i + 1]]);
    if (shuffled.length % 2 === 1) teams.push([shuffled[shuffled.length - 1]]);
    return teams;
  }

  // Swiss-style round pairing: winners bucket faces winners, losers bucket faces losers.
  // lastResult = {teamIdx: 'win'|'loss'|'bye'} from the previous round (empty on round 1 = everyone in one pool).
  // Odd-sized bucket gets one leftover cross-paired against the other bucket's leftover, or a bye if both odd/only one bucket.
  // Best-effort avoids immediate rematches using playedPairs history (tries a few shuffles, keeps the one with fewest repeats).
  function buildTournamentRound(teamCount, lastResult, playedPairs) {
    const played = new Set(playedPairs || []);
    function attempt() {
      const idxs = Array.from({ length: teamCount }, (_, i) => i);
      let winners, losers;
      if (!lastResult || Object.keys(lastResult).length === 0) {
        winners = shuffle([...idxs]);
        losers = [];
      } else {
        winners = shuffle(idxs.filter(i => lastResult[i] !== 'loss'));
        losers = shuffle(idxs.filter(i => lastResult[i] === 'loss'));
      }
      function pairUp(group) {
        const pairs = [];
        for (let i = 0; i + 1 < group.length; i += 2) pairs.push([group[i], group[i + 1]]);
        const leftover = group.length % 2 === 1 ? group[group.length - 1] : null;
        return { pairs, leftover };
      }
      const w = pairUp(winners), l = pairUp(losers);
      const queue = [...w.pairs, ...l.pairs];
      let byes = [];
      if (w.leftover !== null && l.leftover !== null) queue.push([w.leftover, l.leftover]);
      else if (w.leftover !== null) byes = [w.leftover];
      else if (l.leftover !== null) byes = [l.leftover];
      const repeats = queue.filter(([a, b]) => played.has(tpKey(a, b))).length;
      return { queue: shuffle(queue), byes, repeats };
    }
    let best = attempt();
    for (let t = 0; t < 25 && best.repeats > 0; t++) {
      const cand = attempt();
      if (cand.repeats < best.repeats) best = cand;
    }
    return { queue: best.queue, byes: best.byes };
  }

  // ── Actions ────────────────────────────────────────────────────────
  function addPlayer(name) {
    name = name.trim().slice(0, 20);
    if (!name) return;
    S.players.push({ id: S.nextId++, name });
    save(); render();
  }
  function removePlayer(id) {
    S.players = S.players.filter(p => p.id !== id);
    S.presentIds = S.presentIds.filter(x => x !== id);
    save(); render();
  }
  function togglePresent(id) {
    const i = S.presentIds.indexOf(id);
    if (i >= 0) S.presentIds.splice(i, 1); else S.presentIds.push(id);
    save(); render();
  }
  function clearAll() { S = defaultState(); save(); render(); }

  function removePlayerMidGame(id) {
    // Remove from present roster; keep score intact; track as resting
    S.presentIds = S.presentIds.filter(x => x !== id);
    if (!(S.restingIds||[]).includes(id)) S.restingIds = [...(S.restingIds||[]), id];
    S.schedule = []; S.scheduleIdx = -1; // force rebuild next cycle

    const teamIdx = S.teams.findIndex(t => t.includes(id));
    if (teamIdx === -1 || S.screen !== 'playing') {
      showAddPlayer = false; save(); render(); return;
    }

    const remaining = S.teams[teamIdx].filter(x => x !== id);
    if (remaining.length > 0) {
      // Partner stays → team shrinks to solo, no index remap needed
      S.teams[teamIdx] = remaining;
      if (S.mode === 'tournament') S.tournamentTeams[teamIdx] = remaining;
      if (S.lastSoloId === id) S.lastSoloId = remaining[0];
      showAddPlayer = false; save(); render(); return;
    }

    // Remove entire team → remap all team indices
    S.teams.splice(teamIdx, 1);
    if (S.mode === 'tournament') S.tournamentTeams.splice(teamIdx, 1);
    const gone = i => i === teamIdx;
    const remap = i => i > teamIdx ? i - 1 : i;

    S.cyclePlayedPairs = (S.cyclePlayedPairs || [])
      .filter(k => { const [a,b]=k.split(',').map(Number); return !gone(a)&&!gone(b); })
      .map(k => { const [a,b]=k.split(',').map(Number); return tpKey(remap(a),remap(b)); });

    const newTmc = {};
    Object.entries(S.teamMatchCounts||{}).forEach(([k,v]) => {
      const idx=parseInt(k);
      if(!gone(idx)) newTmc[remap(idx)]=v;
    });
    S.teamMatchCounts = newTmc;

    if (S.mode === 'tournament') {
      S.tournamentQueue = (S.tournamentQueue || [])
        .filter(([a,b]) => !gone(a) && !gone(b))
        .map(([a,b]) => [remap(a), remap(b)]);
      S.tournamentPlayedPairs = (S.tournamentPlayedPairs || [])
        .filter(k => { const [a,b]=k.split(',').map(Number); return !gone(a)&&!gone(b); })
        .map(k => { const [a,b]=k.split(',').map(Number); return tpKey(remap(a),remap(b)); });
      const newLr = {};
      Object.entries(S.tournamentLastResult||{}).forEach(([k,v]) => {
        const idx=parseInt(k);
        if(!gone(idx)) newLr[remap(idx)]=v;
      });
      S.tournamentLastResult = newLr;
    }

    // Which court slots lost their occupant?
    const slotANeedsRefill = gone(S.courtIdx) || gone(S.challengerIdx);
    const slotBNeedsRefill = S.dualCourt && (gone(S.courtIdxB) || gone(S.challengerIdxB));

    if (gone(S.courtIdx)) {
      if (S.challengerIdx != null) S.waitQueue.push(S.challengerIdx);
      S.courtIdx = null; S.challengerIdx = null;
    } else if (gone(S.challengerIdx)) {
      S.challengerIdx = null;
    }
    if (S.dualCourt) {
      if (gone(S.courtIdxB)) {
        if (S.challengerIdxB != null) S.waitQueue.push(S.challengerIdxB);
        S.courtIdxB = null; S.challengerIdxB = null;
      } else if (gone(S.challengerIdxB)) {
        S.challengerIdxB = null;
      }
    }

    S.waitQueue = (S.waitQueue||[]).filter(i=>!gone(i)).map(remap);
    if (S.courtIdx != null) S.courtIdx = remap(S.courtIdx);
    if (S.challengerIdx != null) S.challengerIdx = remap(S.challengerIdx);
    if (S.courtIdxB != null) S.courtIdxB = remap(S.courtIdxB);
    if (S.challengerIdxB != null) S.challengerIdxB = remap(S.challengerIdxB);

    if (S.mode === 'tournament') {
      if (slotANeedsRefill) {
        const next = S.tournamentQueue.shift();
        if (next) { S.courtIdx = next[0]; S.challengerIdx = next[1]; } else { S.courtIdx = null; S.challengerIdx = null; }
      }
      if (slotBNeedsRefill) {
        const next = S.tournamentQueue.shift();
        if (next) { S.courtIdxB = next[0]; S.challengerIdxB = next[1]; } else { S.courtIdxB = null; S.challengerIdxB = null; }
      }
      const aDone = S.courtIdx === null;
      const bDone = !S.dualCourt || S.courtIdxB === null;
      if (aDone && bDone) { S.cycleCount++; initTournamentRound(); }
    } else {
      if (slotANeedsRefill) {
        if (S.courtIdx === null && S.waitQueue.length > 0) S.courtIdx = S.waitQueue.shift();
        if (S.courtIdx != null) {
          const r = setupNextMatchForSlot('A');
          if (r !== 'ok') S.challengerIdx = null;
        }
      }
      if (slotBNeedsRefill) {
        if (S.courtIdxB === null && S.waitQueue.length > 0) S.courtIdxB = S.waitQueue.shift();
        if (S.courtIdxB != null) {
          const r = setupNextMatchForSlot('B');
          if (r !== 'ok') S.challengerIdxB = null;
        }
      }
      const aFinished = S.courtIdx === null;
      const bFinished = !S.dualCourt || S.courtIdxB === null;
      if (aFinished && bFinished) { S.screen = 'newcycle'; S.cycleCount++; }
    }

    if (S.lastSoloId === id) S.lastSoloId = null;
    showAddPlayer = false; save(); render();
  }

  function initCycle(teams) {
    S.teams = teams;
    // Track solo player for this cycle
    const soloTeam = teams.find(t => t.length === 1);
    S.lastSoloId = soloTeam ? soloTeam[0] : null;
    S.cyclePlayedPairs = [];
    S.teamMatchCounts = {};

    // Reorder starting positions based on player fatigue (most-rested takes court first).
    // This prevents the same player from playing at the end of cycle N and the start of N+1.
    const pc = S.playerConsecutive || {};
    const fatigue = teams.map((team, i) => ({
      i,
      f: Math.max(0, ...team.map(id => pc[id] || 0)),
    }));
    fatigue.sort((a, b) => a.f - b.f); // least tired → court first

    S.courtIdx     = fatigue[0].i;
    S.challengerIdx = fatigue[1].i;
    S.waitQueue    = fatigue.slice(2).map(x => x.i);
    S.courtIdxB = null;
    S.challengerIdxB = null;

    // Teams starting in waitQueue sit out match 1 → reset their counts now
    S.waitQueue.forEach(tIdx => {
      teams[tIdx].forEach(pid => { if (pc[pid] !== undefined) pc[pid] = 0; });
    });
    S.playerConsecutive = pc;

    // Record partners used
    teams.forEach(t => {
      if (t.length === 2) {
        const k = pairKey(t[0], t[1]);
        if (!S.usedPartners.includes(k)) S.usedPartners.push(k);
      }
    });

    // Dual-court: seed court B with a second match from the same pool
    if (S.dualCourt && S.waitQueue.length > 0) {
      S.courtIdxB = S.waitQueue.shift();
      setupNextMatchForSlot('B');
    }
  }

  function initTournamentRound() {
    S.teams = S.tournamentTeams;
    const { queue, byes } = buildTournamentRound(S.teams.length, S.tournamentLastResult || {}, S.tournamentPlayedPairs || []);
    S.tournamentQueue = queue;
    S.tournamentLastResult = {};
    byes.forEach(idx => { S.tournamentLastResult[idx] = 'bye'; });
    S.cyclePlayedPairs = [];
    S.courtIdx = null;
    S.challengerIdx = null;
    S.courtIdxB = null;
    S.challengerIdxB = null;
    const first = S.tournamentQueue.shift();
    if (first) { S.courtIdx = first[0]; S.challengerIdx = first[1]; }
    if (S.dualCourt) {
      const second = S.tournamentQueue.shift();
      if (second) { S.courtIdxB = second[0]; S.challengerIdxB = second[1]; }
    }
  }

  function startSession() {
    if (S.presentIds.length < 4) return;
    undoStack = [];
    deleteMode = false;
    if (S.mode === 'tournament') {
      S.tournamentTeams = buildFixedTeams(S.presentIds);
      S.tournamentPlayedPairs = [];
      S.tournamentLastResult = {};
      Object.assign(S, {
        screen: 'playing',
        rounds: [],
        scores: Object.fromEntries(S.presentIds.map(id => [id, 0])),
        usedPartners: [],
        cycleCount: 1,
        schedule: [],
        scheduleIdx: -1,
        playerConsecutive: {},
      });
      initTournamentRound();
      save(); render();
      return;
    }
    const schedule = buildSchedule(shuffle([...S.presentIds]));
    Object.assign(S, {
      screen: 'playing',
      rounds: [],
      scores: Object.fromEntries(S.presentIds.map(id => [id, 0])),
      usedPartners: [],
      cycleCount: 1,
      schedule,
      scheduleIdx: 0,
      playerConsecutive: {},
    });
    initCycle(schedule[0]);
    save(); render();
  }

  function undoLastMatch() {
    if (!undoStack.length) return;
    S = undoStack.pop();
    save(); render();
  }

  function addPlayerMidGame(id, name) {
    // id = null means brand-new player
    if (id === null) {
      name = name.trim().slice(0, 20);
      if (!name) return;
      id = S.nextId++;
      S.players.push({ id, name });
    }
    if (S.presentIds.includes(id)) return;
    S.presentIds.push(id);
    S.restingIds = (S.restingIds||[]).filter(x => x !== id);
    if (!S.scores) S.scores = {};
    S.scores[id] = S.scores[id] || 0;
    if (S.mode === 'tournament' && (S.screen === 'playing' || S.screen === 'newcycle')) {
      // New solo team sits out the current round; joins pairing from next round onward
      S.teams.push([id]);
      S.tournamentTeams.push([id]);
    } else if (S.screen === 'playing' || S.screen === 'newcycle') {
      // Inject as new team into current cycle's wait queue
      const newTeamIdx = S.teams.length;
      S.teams.push([id]);
      S.waitQueue.push(newTeamIdx);
      S.teamMatchCounts = S.teamMatchCounts || {};
      S.teamMatchCounts[newTeamIdx] = 0;
    }
    // Invalidate pre-built schedule so next cycle rebuilds with updated player list
    S.schedule = [];
    S.scheduleIdx = -1;
    showAddPlayer = false;
    save(); render();
  }

  function recordWinner(winner, slot) {
    slot = slot || 'A';
    undoStack.push(JSON.parse(JSON.stringify(S)));

    const courtField = slot === 'A' ? 'courtIdx' : 'courtIdxB';
    const challField = slot === 'A' ? 'challengerIdx' : 'challengerIdxB';
    const courtI = S[courtField];
    const challI = S[challField];
    const courtTeam = [...S.teams[courtI]];
    const challengerTeam = [...S.teams[challI]];

    S.rounds.push({ id: S.rounds.length + 1, courtTeam, challengerTeam, winner, cycle: S.cycleCount });
    (winner === 'court' ? courtTeam : challengerTeam)
      .forEach(id => S.scores[id] = (S.scores[id] || 0) + 1);

    if (S.mode === 'tournament') {
      recordWinnerTournament(slot, courtI, challI, winner);
    } else {
      recordWinnerStandard(slot, courtI, challI, winner);
    }

    save(); render();
  }

  function recordWinnerTournament(slot, courtI, challI, winner) {
    const courtField = slot === 'A' ? 'courtIdx' : 'courtIdxB';
    const challField = slot === 'A' ? 'challengerIdx' : 'challengerIdxB';
    const winIdx = winner === 'court' ? courtI : challI;
    const loseIdx = winner === 'court' ? challI : courtI;
    S.tournamentLastResult[winIdx] = 'win';
    S.tournamentLastResult[loseIdx] = 'loss';
    S.tournamentPlayedPairs = [...(S.tournamentPlayedPairs || []), tpKey(courtI, challI)];

    const next = S.tournamentQueue.shift();
    if (next) {
      S[courtField] = next[0];
      S[challField] = next[1];
    } else {
      S[courtField] = null;
      S[challField] = null;
    }

    const aDone = S.courtIdx === null;
    const bDone = !S.dualCourt || S.courtIdxB === null;
    if (aDone && bDone) {
      // Continuous swiss tournament: auto-advance to the next round instead of
      // stopping at a "รอบจบ" screen — winners keep meeting winners, losers keep
      // meeting losers, without interrupting play every couple of matches.
      S.cycleCount++;
      initTournamentRound();
    }
  }

  function recordWinnerStandard(slot, courtI, challI, winner) {
    const courtField = slot === 'A' ? 'courtIdx' : 'courtIdxB';
    const challField = slot === 'A' ? 'challengerIdx' : 'challengerIdxB';

    S.cyclePlayedPairs.push(tpKey(courtI, challI));

    const loserIdx = winner === 'court' ? challI : courtI;
    const winnerIdx = winner === 'court' ? courtI : challI;
    S.waitQueue.push(loserIdx);

    const tmc = S.teamMatchCounts || {};
    tmc[courtI] = (tmc[courtI] || 0) + 1;
    tmc[challI] = (tmc[challI] || 0) + 1;
    S.teamMatchCounts = tmc;

    const pc = S.playerConsecutive || {};
    const otherActive = slot === 'A' ? [S.courtIdxB, S.challengerIdxB] : [S.courtIdx, S.challengerIdx];
    S.waitQueue.slice(0, -1).forEach(tIdx => {
      if (!otherActive.includes(tIdx)) S.teams[tIdx].forEach(pid => { pc[pid] = 0; });
    });
    [...S.teams[courtI], ...S.teams[challI]].forEach(pid => { pc[pid] = (pc[pid] || 0) + 1; });
    S.playerConsecutive = pc;

    const winnerFatigue = Math.max(0, ...S.teams[winnerIdx].map(pid => pc[pid] || 0));
    const threshold = S.matchesPerCycle || 3;
    const hitCap = S.mode === 'limited' && (tmc[winnerIdx] || 0) >= threshold;
    const mustRest = (winnerFatigue >= 2 || hitCap) && S.waitQueue.length > 0;

    if (mustRest) {
      S.waitQueue.push(winnerIdx);
      if (S.mode === 'limited') {
        const pos = S.waitQueue.findIndex(i => (tmc[i] || 0) < threshold);
        S[courtField] = pos >= 0 ? S.waitQueue.splice(pos, 1)[0] : S.waitQueue.shift();
      } else {
        S[courtField] = S.waitQueue.shift();
      }
    } else {
      S[courtField] = winnerIdx;
    }

    const result = setupNextMatchForSlot(slot);
    if (result !== 'ok') S[challField] = null;

    const otherChallField = slot === 'A' ? 'challengerIdxB' : 'challengerIdx';
    const otherCourtActive = S.dualCourt && S[otherChallField] != null;

    if ((result === 'done' || result === 'blocked') && !otherCourtActive) {
      // 'blocked' with no active other court shouldn't happen structurally, but resolve as done to avoid a soft-lock
      S.screen = 'newcycle';
      S.cycleCount++;
    }
  }

  function startNewCycle() {
    undoStack.push(JSON.parse(JSON.stringify(S)));
    if (S.mode === 'tournament') {
      S.screen = 'playing';
      initTournamentRound();
      save(); render();
      return;
    }
    let schedule = S.schedule || [];
    let nextIdx = (S.scheduleIdx ?? -1) + 1;
    if (nextIdx >= schedule.length) {
      // Exhausted full schedule — regenerate with new shuffle
      schedule = buildSchedule(shuffle([...S.presentIds]));
      nextIdx = 0;
    }
    S.schedule = schedule;
    S.scheduleIdx = nextIdx;
    S.screen = 'playing';
    initCycle(schedule[nextIdx]);
    save(); render();
  }

  function skipMatch() {
    if (S.dualCourt) return; // not supported alongside dual-court
    if (S.mode === 'tournament') {
      if (S.tournamentQueue.length === 0) return; // nothing else to swap to
      S.tournamentQueue.push([S.courtIdx, S.challengerIdx]);
      const next = S.tournamentQueue.shift();
      S.courtIdx = next[0]; S.challengerIdx = next[1];
      save(); render(); return;
    }
    const played = new Set(S.cyclePlayedPairs);
    const curKey = tpKey(S.courtIdx, S.challengerIdx);
    const pool = [...S.waitQueue, S.courtIdx, S.challengerIdx];
    // Find another unplayed pair (not the current one)
    for (let i = 0; i < pool.length; i++) {
      for (let j = i + 1; j < pool.length; j++) {
        const k = tpKey(pool[i], pool[j]);
        if (k !== curKey && !played.has(k)) {
          S.courtIdx = pool[i];
          S.challengerIdx = pool[j];
          S.waitQueue = pool.filter(x => x !== S.courtIdx && x !== S.challengerIdx);
          save(); render(); return;
        }
      }
    }
    // No other pair available — cannot skip
  }

  function endSession() { S.screen = 'final'; save(); render(); }
  function continuePlaying() { S.screen = 'playing'; save(); render(); }

  function resetSession() {
    undoStack = [];
    const { nextId, players } = S;

  function renderSummaryModal() {
    const ids = S.presentIds;
    if (!ids || ids.length === 0) return '';

    const allRounds = S.rounds || [];
    const maxCycle = allRounds.length > 0 ? Math.max(...allRounds.map(r => r.cycle || 1)) : 1;
    const isAll = summaryCycle === 0; // 0 = show all cycles combined
    const curCycle = isAll ? 0 : Math.max(1, Math.min(summaryCycle, maxCycle));

    // Filter rounds by selected cycle (or all)
    const cycleRounds = isAll ? allRounds : allRounds.filter(r => (r.cycle || 1) === curCycle);

    // Build partner pair set and solo player set
    const partnered = new Set();
    const soloPlayers = new Set();
    cycleRounds.forEach(r => {
      [r.courtTeam, r.challengerTeam].forEach(team => {
        if (team && team.length === 2) partnered.add(pairKey(team[0], team[1]));
        if (team && team.length === 1) soloPlayers.add(team[0]);
      });
    });

    // Per-player match count from selected rounds
    function matchCount(pid) {
      return cycleRounds.filter(r =>
        (r.courtTeam || []).includes(pid) || (r.challengerTeam || []).includes(pid)
      ).length;
    }

    // Cell size: constrain by both height and width.
    // Column headers are vertical (writing-mode) so width = circle size only, not text.
    // Width budget: modal 92vw - 4vh padding; label col ≈ cs*2.7+1.7vh; each cell ≈ cs*0.82+0.5vh
    const N = ids.length;
    const availWidthVh = window.innerWidth * 0.92 / (window.innerHeight / 100) - 4;
    const csFromWidth = (availWidthVh - 2.2 - N * 0.5) / (N * 0.82 + 2.7);
    const csFromHeight = 42 / N;
    const cellSize = Math.min(6, csFromHeight, csFromWidth);

    // Column headers: vertical text — no width constraint from name length

        }
        const paired = partnered.has(pairKey(rowId, colId));
        return `<td style="text-align:center;padding:0.2vh">
          <span style="display:inline-block;width:${cs * 0.82}vh;height:${cs * 0.82}vh;
            border-radius:50%;background:${paired ? '#16a34a' : '#1e293b'};

            font-size:${cs * 0.55}vh;line-height:${cs * 0.82}vh;text-align:center">${paired ? '✓' : ''}</span>
        </td>`;
      }).join('');
      return `<tr>
        <td style="padding:0.2vh 0.6vh;font-size:${cs * 0.5}vh;color:#94a3b8;font-weight:600;white-space:nowrap;text-align:right;vertical-align:middle">
          ${showCount ? `<span style="font-size:${cs * 0.36}vh;color:#475569;font-weight:400">${mc}m</span>&nbsp; ` : ''}${short}
        </td>
        ${cells}

    const allBtn = `background:${isAll ? '#1d4ed8' : '#334155'};color:${isAll ? '#fff' : '#94a3b8'};border-radius:8px;padding:0.4vh 1.2vh;font-size:1.4vh;font-weight:700`;

      const numTeams = n > 0 ? Math.ceil(n / 2) : 0;
      const maxPerTeam = numTeams - 1;
      const warn = n >= 4 && cap > maxPerTeam;
      return `
    <div style="display:flex;align-items:center;justify-content:center;gap:2vh;margin-top:1.2vh">
      <span style="color:#94a3b8;font-size:1.6vh">สูงสุด (แมต/ทีม):</span>
      <button id="matchesDecBtn" class="btn" style="background:#334155;color:#f1f5f9;border-radius:10px;width:4vh;height:4vh;font-size:2.2vh;font-weight:700;display:flex;align-items:center;justify-content:center">−</button>
      <span style="color:#f1f5f9;font-size:2.4vh;font-weight:800;min-width:3vh;text-align:center">${cap}</span>
      <button id="matchesIncBtn" class="btn" style="background:#334155;color:#f1f5f9;border-radius:10px;width:4vh;height:4vh;font-size:2.2vh;font-weight:700;display:flex;align-items:center;justify-content:center">+</button>
    </div>
    ${warn ? `<div style="margin-top:0.8vh;background:#451a00;border:1px solid #d97706;border-radius:10px;padding:0.8vh 1.2vh;font-size:1.3vh;color:#fbbf24;text-align:center">
      ⚠️ ${n} คน = ${numTeams} ทีม → เล่นได้สูงสุดแค่ <strong>${maxPerTeam} แมต/ทีม</strong> (cap ${cap} เกินกว่าที่เป็นไปได้)
    </div>` : ''}`;
    })() : ''}
    ${S.mode === 'tournament' ? `
    <div style="margin-top:1vh;text-align:center;color:#94a3b8;font-size:1.3vh">คู่ที่ตั้งไว้จะคงที่ทั้งเซสชัน · ชนะเจอชนะ แพ้เจอแพ้ทุกรอบ</div>
    ` : ''}
    <button id="dualCourtBtn" class="btn" style="margin-top:1.2vh;width:100%;padding:1vh;border-radius:12px;font-size:1.6vh;font-weight:700;
      background:${S.dualCourt ? '#16a34a' : '#334155'};color:${S.dualCourt ? '#fff' : '#94a3b8'}">
      🏟️🏟️ เล่น 2 คอร์ดพร้อมกัน ${S.dualCourt ? '✓' : ''}
    </button>
  </div>

  <button id="startBtn" class="btn" ${ok ? '' : 'disabled'}
    style="flex-shrink:0;${ok ? C.btnGreen : C.btnGray}">เริ่มเล่น 🏸</button>

  ${players.length > 0 ? `
  <div style="flex-shrink:0;display:flex;justify-content:center;gap:2vh">
    <button id="toggleDelBtn" class="btn"
      style="background:${deleteMode ? '#7f1d1d' : '#1e293b'};color:${deleteMode ? '#fca5a5' : '#64748b'};
        border-radius:12px;padding:0.6vh 1.5vh;font-size:2vh;border:1px solid ${deleteMode ? '#991b1b' : '#334155'}">
      ${deleteMode ? '✕ ปิดโหมดลบ' : '🗑️ ลบรายชื่อ'}
    </button>
    <button id="clearAllBtn" class="btn" style="background:none;color:#475569;font-size:1.5vh;padding:0.6vh 1vh">ล้างทั้งหมด</button>
  </div>` : '<div></div>'}
</div>`;
  }

  // ── Playing Screen ─────────────────────────────────────────────────
  function renderMatchCard(slot) {

    const label = S.dualCourt ? `<div style="text-align:center;color:#64748b;font-size:1.3vh;font-weight:700;margin-bottom:0.8vh">🏟️ คอร์ด ${slot}</div>` : '';

      return `<div style="flex-shrink:0;${C.card}text-align:center;color:#475569;font-size:1.6vh;padding:2.5vh 1vh">${label}คอร์ดนี้จบแล้ว รอรอบถัดไป</div>`;

    return `

        <div style="color:#94a3b8;font-size:1.3vh;font-weight:700;letter-spacing:.08em;margin-bottom:0.8vh">

        </div>
        ${courtTeam.map(id => `<div style="font-weight:700;color:#93c5fd;font-size:${S.dualCourt ? 2.0 : 2.4}vh;line-height:1.4">${pname(id)}</div>`).join('')}

        ${challengerTeam.map(id => `<div style="font-weight:700;color:#fca5a5;font-size:${S.dualCourt ? 2.0 : 2.4}vh;line-height:1.4">${pname(id)}</div>`).join('')}
      </div>
    </div>
    ${!S.dualCourt && (S.waitQueue||[]).length > 0 && S.mode !== 'tournament' ? `
    <div style="margin-top:1.2vh;padding-top:1.2vh;border-top:1px solid #334155;text-align:center;color:#64748b;font-size:1.5vh">
      รอ: ${S.waitQueue.map(i => S.teams[i].map(pname).join(' & ')).join(' · ')}

  </div>
  <div style="flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:${S.dualCourt ? 1 : 1.5}vh">

      <div style="font-weight:700;font-size:${S.dualCourt ? 1.6 : 1.9}vh;margin-bottom:0.5vh">👑 Court ชนะ</div>
      <div style="font-size:${S.dualCourt ? 1.3 : 1.5}vh;color:#93c5fd">${courtTeam.map(pname).join(' & ')}</div>
    </button>
    <button class="win-btn btn" data-slot="${slot}" data-w="challenger"
      style="${C.teamB}border-radius:16px;padding:${S.dualCourt ? 1.6 : 2.5}vh 1vh;text-align:center;color:#fecaca">
      <div style="font-weight:700;font-size:${S.dualCourt ? 1.6 : 1.9}vh;margin-bottom:0.5vh">⚡ Challenger ชนะ</div>
      <div style="font-size:${S.dualCourt ? 1.3 : 1.5}vh;color:#fca5a5">${challengerTeam.map(pname).join(' & ')}</div>
    </button>
  </div>`;

  function renderPlaying() {
    const { teams, rounds, cycleCount, scores, waitQueue, cyclePlayedPairs } = S;

    const board = S.presentIds
      .map(id => ({ id, name: pname(id), score: scores[id] || 0 }))
      .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));

    const matchNum = rounds.length + 1;
    const N = teams.length;
    const playedThisCycle = (cyclePlayedPairs || []).length;
    const isLimited = S.mode === 'limited';
    const isTournament = S.mode === 'tournament';
    const threshold = S.matchesPerCycle || 3;
    const tmc = S.teamMatchCounts || {};
    const teamsNotDone = isLimited
      ? Array.from({length: N}, (_, i) => i).filter(i => (tmc[i] || 0) < threshold).length
      : 0;
    const cycleTotal = (!isLimited && !isTournament) ? N * (N - 1) / 2 : null;
    const activeMatches = (S.courtIdx != null ? 1 : 0) + (S.dualCourt && S.courtIdxB != null ? 1 : 0);
    const pairsLeft = cycleTotal != null ? (cycleTotal - playedThisCycle - activeMatches) : null;

    // Can skip if another unplayed pair exists besides current (single-court only)
    let canSkip = false;
    if (!S.dualCourt) {
      if (isTournament) {
        canSkip = S.tournamentQueue.length > 0;
      } else {
        const _played = new Set(S.cyclePlayedPairs);
        const _curKey = tpKey(S.courtIdx, S.challengerIdx);
        const _pool = [...(waitQueue||[]), S.courtIdx, S.challengerIdx];
        canSkip = _pool.some((x,i) => _pool.some((y,j) => j>i && tpKey(x,y)!==_curKey && !_played.has(tpKey(x,y))));
      }
    }

    return `
<div class="fade-in" style="display:flex;flex-direction:column;height:100%;gap:1.5vh">

  <div style="flex-shrink:0;display:flex;justify-content:space-between;align-items:center">

      <span style="font-size:2.5vh;font-weight:800">แมตช์ที่ ${matchNum}</span>
      <span style="color:#64748b;font-size:1.6vh;margin-left:1vh">รอบ ${cycleCount}</span>
    </div>
    <div style="display:flex;gap:0.8vh">
      ${undoStack.length > 0 ? `<button id="undoBtn" class="btn" style="background:#334155;color:#fbbf24;border-radius:12px;padding:0.8vh 1.2vh;font-size:1.6vh">↩</button>` : ''}
      <button id="addPlayerBtn" class="btn" style="background:#334155;color:#94a3b8;border-radius:12px;padding:0.8vh 1.2vh;font-size:1.6vh">➕</button>
      <button id="summaryBtn" class="btn" style="background:#334155;color:#94a3b8;border-radius:12px;padding:0.8vh 1.2vh;font-size:1.6vh">📊</button>
      <button id="endBtn" class="btn" style="background:#334155;color:#94a3b8;border-radius:12px;padding:0.8vh 1.2vh;font-size:1.6vh">จบเกม</button>
    </div>
  </div>

  ${S.dualCourt
    ? `<div style="flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:1vh">
        <div style="display:flex;flex-direction:column;gap:1vh">${renderMatchCard('A')}</div>
        <div style="display:flex;flex-direction:column;gap:1vh">${renderMatchCard('B')}</div>
      </div>`
    : renderMatchCard('A')}

  ${canSkip ? `<div style="flex-shrink:0;text-align:center">
    <button id="skipMatchBtn" class="btn" style="background:none;color:#475569;font-size:1.5vh;padding:0.5vh 2vh;border:1px solid #334155;border-radius:10px">⏭ ข้ามแมตนี้ก่อน</button>
  </div>` : ''}

  <!-- Scoreboard -->
  <div style="flex:1;overflow:hidden;min-height:0;${C.card}display:flex;flex-direction:column">
    <div style="color:#64748b;font-size:1.4vh;font-weight:700;letter-spacing:.1em;margin-bottom:1vh;flex-shrink:0">
      SCOREBOARD · ${rounds.length} แมตช์ · ${isTournament
        ? `เหลืออีก ${S.tournamentQueue.length} คู่ในรอบนี้`
        : isLimited
          ? (teamsNotDone > 0 ? `อีก ${teamsNotDone} ทีมยังไม่ครบ ${threshold} แมต` : 'ทุกทีมครบแล้ว!')
          : (pairsLeft > 0 ? `อีก ${pairsLeft} แมตช์จับคู่ใหม่` : 'แมตช์สุดท้ายรอบนี้')}
    </div>
    <div style="overflow-y:auto;flex:1">
      ${board.map((p, i) => {
        const top = i === 0 && p.score > 0;
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:0.8vh 0;${i < board.length-1 ? 'border-bottom:1px solid #1e293b' : ''}">
          <div style="display:flex;align-items:center;gap:1vh">
            <span style="color:#475569;font-size:1.4vh;width:2vh">${i+1}</span>
            <span style="font-size:1.8vh;${top ? 'color:#fde68a;font-weight:700' : ''}">${p.name}</span>
          </div>
          <span style="font-weight:700;font-size:2vh;${top ? 'color:#fde68a' : 'color:#cbd5e1'}">${p.score}</span>
        </div>`;
      }).join('')}
      ${(S.restingIds||[]).length > 0 ? `
      <div style="border-top:1px dashed #334155;margin-top:0.5vh;padding-top:0.5vh">
        <div style="color:#475569;font-size:1.2vh;font-weight:700;margin-bottom:0.4vh">💤 พัก</div>
        ${(S.restingIds||[]).map(id => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0.5vh 0;opacity:0.55">
          <span style="font-size:1.6vh;color:#64748b">${pname(id)}</span>
          <span style="font-weight:700;font-size:1.8vh;color:#475569">${scores[id]||0}</span>
        </div>`).join('')}
      </div>` : ''}
    </div>
  </div>
</div>`;
  }

  // ── New Cycle Screen ───────────────────────────────────────────────
  function renderNewCycle() {
    const { cycleCount, scores } = S;
    const board = S.presentIds
      .map(id => ({ id, name: pname(id), score: scores[id] || 0 }))
      .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));

    return `
<div class="fade-in" style="display:flex;flex-direction:column;height:100%;gap:1.5vh">

  <div style="flex-shrink:0;text-align:center">
    <div style="font-size:4vh">🔄</div>
    <h1 style="font-size:2.5vh;font-weight:800;margin-top:0.5vh">รอบ ${cycleCount - 1} จบแล้ว!</h1>
    <p style="color:#94a3b8;font-size:1.7vh;margin-top:0.3vh">จับคู่ใหม่</p>
  </div>
  ${S.mode !== 'tournament' && allPartnersUsed() ? `
  <div style="flex-shrink:0;background:#1e3a2f;border:1px solid #16a34a;border-radius:14px;padding:1.2vh 1.5vh;text-align:center">
    <div style="font-size:1.8vh;font-weight:700;color:#4ade80">🎉 จับคู่ครบทุก combination แล้ว!</div>
    <div style="font-size:1.4vh;color:#86efac;margin-top:0.3vh">รอบถัดไปจะเริ่มซ้ำคู่เดิม</div>
  </div>` : ''}

  <!-- Scoreboard -->
  <div style="flex:1;overflow:hidden;min-height:0;${C.card}display:flex;flex-direction:column">
    <div style="color:#64748b;font-size:1.4vh;font-weight:700;letter-spacing:.1em;margin-bottom:1vh;flex-shrink:0">SCOREBOARD รวม</div>
    <div style="overflow-y:auto;flex:1">
      ${board.map((p, i) => {
        const medals = ['🥇','🥈','🥉'];
        const top = i === 0 && p.score > 0;
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:1vh 0;${i < board.length-1 ? 'border-bottom:1px solid #334155' : ''}">
          <div style="display:flex;align-items:center;gap:1.5vh">
            <span style="font-size:2vh">${medals[i] || `${i+1}.`}</span>
            <span style="font-size:1.9vh;${top ? 'color:#fde68a;font-weight:700' : ''}">${p.name}</span>
          </div>
          <span style="font-weight:700;font-size:2.2vh;${top ? 'color:#fde68a' : 'color:#cbd5e1'}">${p.score}</span>
        </div>`;
      }).join('')}
      ${(S.restingIds||[]).length > 0 ? `
      <div style="border-top:1px dashed #334155;margin-top:0.5vh;padding-top:0.5vh">
        <div style="color:#475569;font-size:1.2vh;font-weight:700;margin-bottom:0.4vh">💤 พัก</div>
        ${(S.restingIds||[]).map(id => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0.5vh 0;opacity:0.55">
          <span style="font-size:1.6vh;color:#64748b">${pname(id)}</span>
          <span style="font-weight:700;font-size:1.8vh;color:#475569">${(S.scores||{})[id]||0}</span>
        </div>`).join('')}
      </div>` : ''}
    </div>
  </div>

  <div style="flex-shrink:0;display:flex;gap:1vh">
    <button id="newCycleBtn" class="btn" style="flex:1;${C.btnGreen}">เล่นต่อ รอบใหม่ 🏸</button>
    ${undoStack.length > 0 ? `<button id="undoBtn" class="btn" style="background:#334155;color:#fbbf24;border-radius:16px;padding:1.8vh 1.5vh;font-size:1.8vh;font-weight:700">↩</button>` : ''}
  </div>
  <div style="flex-shrink:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:1vh">
    <button id="summaryBtn" class="btn" style="background:#1e293b;color:#94a3b8;border-radius:12px;padding:1vh;font-size:1.4vh;border:1px solid #334155">📊 History</button>
    <button id="addPlayerBtn" class="btn" style="background:#1e293b;color:#94a3b8;border-radius:12px;padding:1vh;font-size:1.4vh;border:1px solid #334155">➕ เพิ่มคน</button>
    <button id="endBtn" class="btn" style="background:#334155;color:#f1f5f9;border-radius:12px;font-weight:700;font-size:1.4vh;padding:1vh;">จบเกม 🏆</button>
  </div>
</div>`;
  }

  // ── Final Screen ───────────────────────────────────────────────────
  function renderFinal() {
    const { scores } = S;
    const board = S.presentIds
      .map(id => ({ id, name: pname(id), score: scores[id] || 0 }))
      .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));

    const topScore = board[0]?.score || 0;
    const champs = board.filter(p => p.score === topScore && topScore > 0);
    const medals = ['🥇','🥈','🥉'];
    const total = (S.rounds || []).length;

    return `
<div class="fade-in" style="display:flex;flex-direction:column;height:100%;gap:1.5vh;text-align:center">
  <div style="flex-shrink:0">
    <div style="font-size:5vh">🏆</div>
    <h1 style="font-size:2.8vh;font-weight:800;margin-top:0.5vh">ผลการแข่งขัน</h1>
    <p style="color:#94a3b8;font-size:1.7vh;margin-top:0.3vh">${total} แมตช์ · ${S.cycleCount || 1} รอบ</p>
  </div>

  ${champs.length > 0 ? `
  <div style="flex-shrink:0;background:linear-gradient(to bottom,#451a00,#1e293b);border:1px solid #78350f;border-radius:16px;padding:2.5vh">
    <div style="font-size:4vh">${champs.length > 1 ? '🤝' : '🥇'}</div>
    <div style="color:#fde68a;font-weight:700;font-size:2.5vh;margin-top:0.8vh">${champs.map(c => c.name).join(' & ')}</div>
    <div style="color:#d97706;font-size:1.7vh;margin-top:0.3vh">${topScore} แต้ม</div>
  </div>` : `<div style="flex-shrink:0;${C.card}color:#64748b;font-size:1.8vh;padding:2vh">ยังไม่มีแต้ม</div>`}

  <div style="flex:1;overflow:hidden;min-height:0;${C.card}display:flex;flex-direction:column;text-align:left">
    <div style="overflow-y:auto;flex:1">
      ${board.map((p, i) => {
        const top = i === 0 && topScore > 0;
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:1vh 0;${i < board.length-1 ? 'border-bottom:1px solid #334155' : ''}">
          <div style="display:flex;align-items:center;gap:1.5vh">
            <span style="font-size:2.5vh">${medals[i] || `${i+1}.`}</span>
            <span style="font-size:1.9vh;${top ? 'color:#fde68a;font-weight:700' : 'font-weight:600'}">${p.name}</span>
          </div>
          <span style="font-weight:700;font-size:2.2vh;${top ? 'color:#fde68a' : 'color:#cbd5e1'}">${p.score}</span>
        </div>`;
      }).join('')}
      ${(S.restingIds||[]).length > 0 ? `
      <div style="border-top:1px dashed #334155;margin-top:0.5vh;padding-top:0.5vh">
        <div style="color:#475569;font-size:1.2vh;font-weight:700;margin-bottom:0.4vh">💤 พัก</div>
        ${(S.restingIds||[]).map(id => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0.5vh 0;opacity:0.55">
          <span style="font-size:1.7vh;color:#64748b">${pname(id)}</span>
          <span style="font-weight:700;font-size:2vh;color:#475569">${(S.scores||{})[id]||0}</span>
        </div>`).join('')}
      </div>` : ''}
    </div>
  </div>

  <div style="flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:1.5vh">
    <button id="contBtn" class="btn" style="background:#1d4ed8;color:#fff;border-radius:16px;padding:1.8vh;font-size:1.9vh;font-weight:700;">เล่นต่อ</button>
    <button id="resetBtn" class="btn" style="background:#334155;color:#f1f5f9;border-radius:16px;padding:1.8vh;font-size:1.9vh;font-weight:700;">เริ่มใหม่</button>
  </div>
</div>`;
  }

  // ── Event binding ──────────────────────────────────────────────────
  function bind() {
    const q = id => document.getElementById(id);
    const qa = sel => document.querySelectorAll(sel);

    // Setup
    const inp = q('inp');
    q('addBtn')?.addEventListener('click', () => { addPlayer(inp.value); inp.value = ''; inp.focus(); });
    inp?.addEventListener('keydown', e => { if (e.key === 'Enter') { addPlayer(inp.value); inp.value = ''; } });
    qa('.tog').forEach(b => b.addEventListener('click', () => togglePresent(+b.dataset.id)));
    qa('.del-btn').forEach(b => b.addEventListener('click', () => { removePlayer(+b.dataset.id); }));
    q('startBtn')?.addEventListener('click', startSession);
    q('clearAllBtn')?.addEventListener('click', () => { if (confirm('ล้างข้อมูลทั้งหมด?')) { deleteMode = false; clearAll(); } });
    q('toggleDelBtn')?.addEventListener('click', () => { deleteMode = !deleteMode; render(); });
    q('modeFullBtn')?.addEventListener('click', () => { S.mode = 'full'; save(); render(); });
    q('modeLimitedBtn')?.addEventListener('click', () => { S.mode = 'limited'; save(); render(); });
    q('modeTournamentBtn')?.addEventListener('click', () => { S.mode = 'tournament'; save(); render(); });
    q('dualCourtBtn')?.addEventListener('click', () => { S.dualCourt = !S.dualCourt; save(); render(); });
    q('matchesDecBtn')?.addEventListener('click', () => { S.matchesPerCycle = Math.max(1, (S.matchesPerCycle || 3) - 1); save(); render(); });
    q('matchesIncBtn')?.addEventListener('click', () => { S.matchesPerCycle = Math.min(30, (S.matchesPerCycle || 3) + 1); save(); render(); });

    // Playing
    qa('.win-btn').forEach(b => b.addEventListener('click', () => recordWinner(b.dataset.w, b.dataset.slot)));
    q('undoBtn')?.addEventListener('click', undoLastMatch);
    q('skipMatchBtn')?.addEventListener('click', skipMatch);
    q('themeToggleBtn')?.addEventListener('click', () => { theme = theme==='dark'?'light':'dark'; localStorage.setItem('bmt_theme', theme); render(); });
    q('addPlayerBtn')?.addEventListener('click', () => { showAddPlayer = true; render(); });
    q('endBtn')?.addEventListener('click', endSession);

    // New cycle
    q('newCycleBtn')?.addEventListener('click', startNewCycle);

    // Add player panel
    q('closeAddPlayerBtn')?.addEventListener('click', () => { showAddPlayer = false; render(); });
    q('addPlayerOverlay')?.addEventListener('click', e => { if (e.target.id === 'addPlayerOverlay') { showAddPlayer = false; render(); } });
    q('addMidBtn')?.addEventListener('click', () => {
      const inp = q('addMidInp');
      addPlayerMidGame(null, inp.value);
    });
    q('addMidInp')?.addEventListener('keydown', e => { if (e.key === 'Enter') { addPlayerMidGame(null, e.target.value); } });
    qa('.add-absent-btn').forEach(b => b.addEventListener('click', () => addPlayerMidGame(+b.dataset.id, null)));
    qa('.remove-present-btn').forEach(b => b.addEventListener('click', () => removePlayerMidGame(+b.dataset.id)));

    // Final
    q('contBtn')?.addEventListener('click', continuePlaying);
    q('resetBtn')?.addEventListener('click', resetSession);

    // Summary modal
    q('summaryBtn')?.addEventListener('click', () => {
      const allRounds = S.rounds || [];
      summaryCycle = allRounds.length > 0 ? Math.max(...allRounds.map(r => r.cycle || 1)) : 1;
      showSummary = true; render();
    });
    q('closeSummaryBtn')?.addEventListener('click', () => { showSummary = false; render(); });
    q('summaryOverlay')?.addEventListener('click', e => { if (e.target.id === 'summaryOverlay') { showSummary = false; render(); } });
    q('prevCycleBtn')?.addEventListener('click', () => { summaryCycle--; render(); });
    q('nextCycleBtn')?.addEventListener('click', () => { summaryCycle++; render(); });
    q('toggleAllCyclesBtn')?.addEventListener('click', () => {
      if (summaryCycle === 0) {
        // Switch back to latest cycle
        const allRounds = S.rounds || [];
        summaryCycle = allRounds.length > 0 ? Math.max(...allRounds.map(r => r.cycle || 1)) : 1;
      } else {
        summaryCycle = 0;
      }
      render();
    });
  }

  render();

  // ── Pull-to-refresh ────────────────────────────────────────────────
  (function() {
    const ptr = document.getElementById('ptr');
    const THRESHOLD = 75; // px pull distance to trigger
    let startY = 0, pulling = false, released = false;

    document.addEventListener('touchstart', e => {
      if (released) return;
      if (e.touches[0].clientY > 70) return; // only near top
      startY = e.touches[0].clientY;
      pulling = true;
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (!pulling) return;
      const dy = Math.max(0, e.touches[0].clientY - startY);
      const h = Math.min(dy * 0.5, THRESHOLD);
      ptr.style.height = h + 'px';
      const ready = dy >= THRESHOLD * 2;
      ptr.innerHTML = `<span style="font-size:1.4vh;color:${ready ? '#4ade80' : '#64748b'};padding-bottom:1vh">${ready ? '↑ ปล่อยเพื่อ refresh' : '↓ ดึงเพื่อ refresh'}</span>`;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      if (!pulling) return;
      pulling = false;
      const dy = e.changedTouches[0].clientY - startY;
      if (dy >= THRESHOLD * 2) {
        released = true;
        ptr.style.height = '40px';
        ptr.innerHTML = '<span style="font-size:1.4vh;color:#4ade80;padding-bottom:1vh">🔄 กำลัง refresh…</span>';
        setTimeout(() => location.reload(), 400);
      } else {
        ptr.style.transition = 'height 0.2s';
        ptr.style.height = '0';
        setTimeout(() => { ptr.style.transition = ''; ptr.innerHTML = ''; }, 220);
      }
    }, { passive: true });
  })();
  </script>
</body>
</html>
